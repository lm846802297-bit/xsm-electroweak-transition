name: archive-covariance

on:
  push:
    branches:
      - research/eft-matching-audit
    paths:
      - 'src/xsm_ewpt/**'
      - 'scripts/run_covariance_scan.py'
      - 'scripts/write_sha256_manifest.py'
      - 'metadata/covariance-ensemble.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project test dependencies
        run: python -m pip install -e '.[test]'

      - name: Compile sources
        run: python -m compileall -q src tests scripts

      - name: Run unit and symbolic tests
        run: python -m pytest -q | tee results/validation/pytest.txt

      - name: Reproduce 100-point covariance ensemble
        run: python scripts/run_covariance_scan.py > results/validation/covariance-run.log

      - name: Generate provenance and complete SHA-256 manifest
        run: python scripts/write_sha256_manifest.py

      - name: Commit native outputs and fingerprints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/validation/covariance-ensemble.csv \
                  results/validation/covariance-summary.json \
                  results/validation/covariance-run.log \
                  results/validation/pytest.txt \
                  metadata/SHA256SUMS \
                  metadata/provenance.json
          if git diff --cached --quiet; then
            echo "No validation artifacts changed."
          else
            git commit -m "archive: reproduce covariance ensemble and SHA-256 manifest [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
